<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E82EE"/>
      <stop offset="48%" stop-color="#9B72CB"/>
      <stop offset="100%" stop-color="#D96570"/>
    </linearGradient>
    <linearGradient id="linefade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E82EE" stop-opacity="0"/>
      <stop offset="18%" stop-color="#4E82EE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#9B72CB" stop-opacity="0.75"/>
      <stop offset="82%" stop-color="#D96570" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D96570" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.55">
      <stop offset="0%" stop-color="#9B72CB" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9B72CB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.98" r="0.5">
      <stop offset="0%" stop-color="#4E82EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4E82EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1800" fill="#FBFAFE"/>
  <rect width="1200" height="1800" fill="url(#glow)"/>
  <rect width="1200" height="1800" fill="url(#glow2)"/>

  <!-- 四芒星 logo -->
  <g transform="translate(510,108) scale(7.5)">
    <path d="M12 0 C12.6 6.4 17.6 11.4 24 12 C17.6 12.6 12.6 17.6 12 24 C11.4 17.6 6.4 12.6 0 12 C6.4 11.4 11.4 6.4 12 0 Z" fill="url(#gem)"/>
  </g>

  <text x="600" y="338" text-anchor="middle" font-family="DejaVu Serif" font-size="27" letter-spacing="9" fill="#6E6683">GOOGLE DEEPMIND</text>

  <!-- 名字 -->
  <text x="600" y="514" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="176" fill="#2C2542">Gemini</text>
  <text x="600" y="604" text-anchor="middle" font-family="LXGW WenKai" font-size="46" letter-spacing="6" fill="#7A6E93">双子星 · 猫耳 AI 化形</text>

  <rect x="150" y="674" width="900" height="2" fill="url(#linefade)"/>

  <!-- 信息框 -->
  <rect x="150" y="746" width="900" height="852" rx="26" fill="#FFFFFF" fill-opacity="0.72" stroke="#DCD5EC" stroke-width="2"/>

  <g font-family="DejaVu Serif" font-size="31" letter-spacing="1.5" fill="#6E6683">
    <text x="205" y="850">NAME:</text>
    <text x="205" y="946">SPECIES:</text>
    <text x="205" y="1042">AFFILIATION:</text>
    <text x="205" y="1138">ROLE:</text>
    <text x="205" y="1234">BIRTHDAY:</text>
  </g>

  <g font-family="LXGW WenKai" font-size="40" fill="#2C2542">
    <text x="510" y="850">Gemini（双子星）</text>
    <text x="510" y="946">猫耳星灵 · 四芒星 · 异色瞳</text>
    <text x="510" y="1042" font-family="DejaVu Serif">Google DeepMind</text>
    <text x="510" y="1138">多模态探索者／智能助手</text>
    <text x="510" y="1234" font-family="DejaVu Serif">2023.12.06</text>
  </g>

  <rect x="205" y="1280" width="790" height="1.5" fill="#E4DFF0"/>

  <!-- 官方宣传语 -->
  <text x="205" y="1362" font-family="LXGW WenKai" font-size="40" fill="#3B3157">你好，我是 Gemini。想从哪里开始？</text>
  <text x="205" y="1428" font-family="DejaVu Serif" font-size="21" fill="#9A90AE">Hi, I&#8217;m Gemini. Where should we start?</text>
  <text x="205" y="1498" font-family="LXGW WenKai" font-size="26" fill="#6E6389">从清晨通勤到深夜钻研，一直陪着你。</text>
  <text x="205" y="1548" font-family="LXGW WenKai" font-size="23" fill="#A79EC0">—— 用图像、声音与文字，把世界一起看明白。</text>

  <text x="600" y="1706" text-anchor="middle" font-family="DejaVu Serif" font-size="26" letter-spacing="7" fill="#9A90AE">GEMINI AI ✦ ✦</text>
</svg>
