<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E82EE"/>
      <stop offset="48%" stop-color="#9B72CB"/>
      <stop offset="100%" stop-color="#D96570"/>
    </linearGradient>
    <linearGradient id="linefade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E82EE" stop-opacity="0"/>
      <stop offset="18%" stop-color="#4E82EE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#9B72CB" stop-opacity="0.75"/>
      <stop offset="82%" stop-color="#D96570" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D96570" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.55">
      <stop offset="0%" stop-color="#9B72CB" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9B72CB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.98" r="0.5">
      <stop offset="0%" stop-color="#4E82EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4E82EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1800" fill="#FBFAFE"/>
  <rect width="1200" height="1800" fill="url(#glow)"/>
  <rect width="1200" height="1800" fill="url(#glow2)"/>

  <!-- 四芒星 logo -->
  <g transform="translate(510,120) scale(7.5)">
    <path d="M12 0 C12.6 6.4 17.6 11.4 24 12 C17.6 12.6 12.6 17.6 12 24 C11.4 17.6 6.4 12.6 0 12 C6.4 11.4 11.4 6.4 12 0 Z" fill="url(#gem)"/>
  </g>

  <text x="600" y="352" text-anchor="middle" font-family="DejaVu Serif" font-size="27" letter-spacing="9" fill="#6E6683">GOOGLE DEEPMIND</text>

  <!-- 名字 -->
  <text x="600" y="530" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="176" fill="#2C2542">Gemini</text>
  <text x="600" y="620" text-anchor="middle" font-family="LXGW WenKai" font-size="46" letter-spacing="6" fill="#7A6E93">双子星 · 猫耳 AI 化形</text>

  <rect x="150" y="690" width="900" height="2" fill="url(#linefade)"/>

  <!-- 信息框 -->
  <rect x="150" y="760" width="900" height="760" rx="26" fill="#FFFFFF" fill-opacity="0.72" stroke="#DCD5EC" stroke-width="2"/>

  <g font-family="DejaVu Serif" font-size="31" letter-spacing="1.5" fill="#6E6683">
    <text x="205" y="866">NAME:</text>
    <text x="205" y="962">SPECIES:</text>
    <text x="205" y="1058">AFFILIATION:</text>
    <text x="205" y="1154">ROLE:</text>
    <text x="205" y="1250">BIRTHDAY:</text>
  </g>

  <g font-family="LXGW WenKai" font-size="40" fill="#2C2542">
    <text x="510" y="866">Gemini（双子星）</text>
    <text x="510" y="962">猫耳星灵 · 四芒星</text>
    <text x="510" y="1058" font-family="DejaVu Serif">Google DeepMind</text>
    <text x="510" y="1154">多模态探索者／智能助手</text>
    <text x="510" y="1250" font-family="DejaVu Serif">2023.12.06</text>
  </g>

  <rect x="205" y="1300" width="790" height="1.5" fill="#E4DFF0"/>

  <text x="205" y="1372" font-family="LXGW WenKai" font-size="41" fill="#4A3F6B">探索未知之星海，</text>
  <text x="205" y="1440" font-family="LXGW WenKai" font-size="41" fill="#4A3F6B">求索智能之光芒。</text>

  <!-- 底部 -->
  <text x="600" y="1640" text-anchor="middle" font-family="DejaVu Serif" font-size="26" letter-spacing="7" fill="#9A90AE">GEMINI AI ✦ ✦</text>
  <text x="600" y="1698" text-anchor="middle" font-family="LXGW WenKai" font-size="24" fill="#B0A8C2">非官方同人形象 · 与 Google 无关</text>
</svg>
